name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic_data.py
      - name: Train demo artifacts
        run: python scripts/train_demo_model.py --rows 1200
      - name: Tests
        run: pytest -q
      - name: Content and privacy scan
        run: python scripts/scan_content.py --out /tmp/ctaid-poc-scan.txt
