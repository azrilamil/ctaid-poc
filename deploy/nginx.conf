# nginx front for the CTAID POC Streamlit app.
# Port 80 answers /health locally, then proxies the app and its websocket.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 3m;

    # Cheap health endpoint for the container and Coolify health checks.
    location = /health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","app":"ctaid-poc"}';
    }

    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","app":"ctaid-poc"}';
    }

    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8080/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
