[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "var", "node_modules", "convex/_generated", "docs/screenshots"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are handled by the formatter width above
    "B008",   # Streamlit and FastAPI style default calls
    "SIM108", # ternary rewrites hurt readability in the chart builders
    "C408",   # dict() literals read better in the nested Plotly layout blocks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["default"]
